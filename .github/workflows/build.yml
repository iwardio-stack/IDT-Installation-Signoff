name: Build IDT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - - name: Extract project ZIP
  run: |
    mkdir project
    ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
    echo "Found ZIP: $ZIP_FILE"
    unzip -q "$ZIP_FILE" -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
